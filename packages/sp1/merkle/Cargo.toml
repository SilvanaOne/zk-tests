[package]
name = "sp1-merkle-bench"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "map-bench"

[lib]
name = "merkle_bench"
path = "src/lib.rs"

[[bin]]
name = "map-bench"
path = "src/main.rs"

# The guests are a separate workspace so their [patch] table never reaches this crate.
[workspace]
exclude = ["program"]

[dependencies]
anyhow = "1.0.104"
bincode = "1.3.3"
borsh = "1.6"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
jmt = { version = "=0.12.0", default-features = false, features = ["std"] }
libc = "0.2"
merkle-map = { path = "program/map" }
rand = { version = "0.10.3", features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# jmt implements its hasher trait for digest 0.10. `compress` gives the host hardware SHA-256 blocks.
sha2 = { version = "=0.10.9", features = ["compress"] }
slop-algebra = "=6.10.0"
slop-symmetric = "=6.10.0"
sp1-core-executor = "=6.10.0"
sp1-primitives = "=6.10.0"
sp1-sdk = "=6.10.0"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
# The crate the indexed map was adapted from, to check it still builds the same trees with SHA-256.
indexed-merkle-map = { git = "https://github.com/SilvanaOne/silvana", rev = "ee8a98644f137e4d26c04e6565a019906a66983c" }

[build-dependencies]
sp1-build = "=6.10.0"
